<!doctype html>
<html>
  <head>
    <meta charset="utf-8" />
    <title>Apple Docs Alt Formats</title>
    <link rel="stylesheet" href="style.css" />
  </head>
  <body>
    <main>
      <h1 id="name"></h1>
      <p id="description"></p>
      <dl>
        <div class="row">
          <dt>Version</dt>
          <dd id="version"></dd>
        </div>
        <div class="row">
          <dt>Built for</dt>
          <dd id="target"></dd>
        </div>
        <div class="row">
          <dt>Built</dt>
          <dd id="build-time"></dd>
        </div>
        <div class="row">
          <dt>Author</dt>
          <dd id="author"></dd>
        </div>
      </dl>
      <a id="source-link" class="source-link" href="#" target="_blank" rel="noopener">
        View source on GitHub
      </a>
    </main>
    <script type="module" src="main.ts"></script>
  </body>
</html>
